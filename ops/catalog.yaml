# ops/README.md 的唯一事实来源。
#
# Rules:
# - 只登记已交付证据；不要把未来移植写成已完成。
# - 规划中的厂商只放在 platform_families；测试和报告合入后再加入算子条目。
# - 修改本文件后运行 scripts/build_ops_index.py。

# - 证据等级以「算子 + profile」为最小记录单位：platforms.<family>.
#   evidence.profiles.<profile> 记 level/basis/report（issue #41 审阅），
#   operator 顶层 evidence 只是这些记录的派生汇总，不能独立填写；
#   README 按 profile 展示等级，单个 family 下多个 profile 不共享
#   未区分的等级。

schema: 1
updated: 2026-11-01

